  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='1' width='14' height='14' rx='2' fill='%232456c4'/%3E%3Crect x='1' y='1' width='14' height='4.5' rx='2' fill='%231a44a6'/%3E%3C/svg%3E" />

  <!-- Set the saved theme before first paint to avoid a flash of the wrong theme. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('xpfolio-theme');
        if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) { /* storage unavailable */ }
    })();
  </script>

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/windows.css" />
  <link rel="stylesheet" href="css/responsive.css" />
<base target="_blank">
